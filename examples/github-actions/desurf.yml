# Copy into your repository as .github/workflows/desurf.yml
# Point `suite` at your committed Desurf suite (cassettes + suite.json).
#
# Offline test gate. No OPENROUTER_API_KEY. No live provider.
# Exit codes from Desurf fail the job:
#   0 = PASS
#   1 = REGRESSION / FLAKY
#   2 = ERROR (including stale provenance)
#
# Pins:
# - Action ref: @main is the development tip; prefer a full commit SHA in production.
#   A stable v0.4 Action tag will be created only when the v0.4 release is cut (not yet).
# - npm package: pin with `version:` (never "latest"); default/current stable is 0.4.3

name: Desurf offline gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  desurf:
    name: Offline regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Desurf suite (offline)
        uses: desurfofficial-ship-it/Desurf@main
        with:
          suite: ./desurf-suite
          version: "0.4.3"
