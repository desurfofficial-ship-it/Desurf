name: tmp-openrouter-secret-probe

on:
  workflow_dispatch:

jobs:
  probe:
    name: One authenticated OpenRouter request
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check secret presence (no value logged)
        id: secret_check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "secret_present=false" >> "$GITHUB_OUTPUT"
            echo "OPENROUTER_API_KEY is not configured (empty)."
            exit 1
          fi
          echo "secret_present=true" >> "$GITHUB_OUTPUT"
          echo "OPENROUTER_API_KEY is present (value not shown)."

      - name: Minimal authenticated OpenRouter request
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          # One minimal chat completion; never echo the key or response body secrets.
          HTTP_CODE=$(curl -sS -o /tmp/or_body.json -w "%{http_code}" \
            -X POST "https://openrouter.ai/api/v1/chat/completions" \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Reply with exactly: OK"}],"max_tokens":5}')

          echo "http_status=${HTTP_CODE}"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "authentication_and_request=success"
            # Report only whether choices[0].message.content exists (no full dump of errors that might echo headers).
            if command -v jq >/dev/null 2>&1; then
              HAS_CONTENT=$(jq -r '(.choices[0].message.content // "") | length > 0' /tmp/or_body.json 2>/dev/null || echo false)
              echo "has_message_content=${HAS_CONTENT}"
            else
              echo "has_message_content=unknown (jq not available)"
            fi
            exit 0
          fi

          echo "authentication_and_request=failed"
          # Safe error summary: status only + truncated generic error message field if JSON.
          if command -v jq >/dev/null 2>&1; then
            ERR_MSG=$(jq -r '.error.message // .error // empty' /tmp/or_body.json 2>/dev/null | head -c 200)
            echo "provider_error_message=${ERR_MSG}"
          fi
          exit 1
