name: tmp-openrouter-secret-probe

on:
  workflow_dispatch:

jobs:
  probe:
    name: One authenticated OpenRouter request
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check secret presence (no value logged)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${OPENROUTER_API_KEY//[[:space:]]/}" ]; then
            echo "secret_present=false"
            echo "OPENROUTER_API_KEY is not configured (empty)."
            exit 1
          fi
          echo "secret_present=true"
          echo "OPENROUTER_API_KEY is present (value not shown)."

      - name: Minimal authenticated OpenRouter request
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, urllib.error, urllib.request

          key = os.environ.get("OPENROUTER_API_KEY", "").strip()
          if not key:
              print("secret_present=false")
              raise SystemExit(1)

          payload = {
              "model": "openai/gpt-4o-mini",
              "messages": [{"role": "user", "content": "Reply with exactly: OK"}],
              "max_tokens": 5,
          }
          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=data,
              method="POST",
              headers={
                  "Authorization": f"Bearer {key}",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read().decode("utf-8", errors="replace")
                  code = resp.getcode()
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", errors="replace")
              code = e.code

          print(f"http_status={code}")
          if 200 <= code < 300:
              print("authentication_and_request=success")
              try:
                  parsed = json.loads(body)
                  content = (
                      (parsed.get("choices") or [{}])[0]
                      .get("message", {})
                      .get("content")
                      or ""
                  )
                  print(f"has_message_content={'true' if len(content) > 0 else 'false'}")
              except Exception:
                  print("has_message_content=false")
              raise SystemExit(0)

          print("authentication_and_request=failed")
          try:
              parsed = json.loads(body)
              err = parsed.get("error")
              msg = err.get("message") if isinstance(err, dict) else err
              print(f"provider_error_message={str(msg)[:200]}")
          except Exception:
              print("provider_error_message=(unparseable body)")
          raise SystemExit(1)
          PY
