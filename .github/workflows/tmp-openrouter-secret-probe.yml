name: tmp-openrouter-secret-probe

on:
  workflow_dispatch:

jobs:
  probe:
    name: One authenticated OpenRouter request
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check secret presence (no value logged)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "secret_present=false"
            echo "OPENROUTER_API_KEY is not configured (empty)."
            exit 1
          fi
          echo "secret_present=true"
          echo "OPENROUTER_API_KEY is present (value not shown)."

      - name: Minimal authenticated OpenRouter request
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          cat > /tmp/or_payload.json <<'EOF'
          {"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Reply with exactly: OK"}],"max_tokens":5}
          EOF
          # Trim leading spaces introduced by YAML indentation in heredoc
          python3 -c "import pathlib; p=pathlib.Path('/tmp/or_payload.json'); p.write_text(p.read_text().strip()+chr(10))"

          HTTP_CODE=$(curl -sS -o /tmp/or_body.json -w "%{http_code}" \
            -X POST "https://openrouter.ai/api/v1/chat/completions" \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/or_payload.json)

          echo "http_status=${HTTP_CODE}"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "authentication_and_request=success"
            HAS_CONTENT=$(python3 -c "import json; d=json.load(open('/tmp/or_body.json')); c=(d.get('choices') or [{}])[0].get('message',{}).get('content') or ''; print('true' if len(c)>0 else 'false')")
            echo "has_message_content=${HAS_CONTENT}"
            exit 0
          fi

          echo "authentication_and_request=failed"
          python3 -c "import json; d=json.load(open('/tmp/or_body.json')); e=d.get('error'); m=e.get('message') if isinstance(e,dict) else e; print('provider_error_message='+str(m)[:200])" 2>/dev/null || true
          exit 1
