name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.7.0). Leave empty to use package.json version."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  audit-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run audit gate
        env:
          AUDIT_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: bash ci/audit-gate.sh

  publish:
    needs: audit-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@^11.5.1

      - name: Verify release version
        id: ver
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v${PKG_VERSION}"
          fi
          if [ "${TAG#v}" != "$PKG_VERSION" ]; then
            echo "Release tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check if version already published
        id: published
        run: |
          VER="${{ steps.ver.outputs.pkg_version }}"
          if npm view "@desurfofficial-ship-it/desurf@${VER}" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VER} is already on npm — skipping publish (idempotent success)."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.published.outputs.already != 'true'
        run: npm install

      - name: Typecheck
        if: steps.published.outputs.already != 'true'
        run: npm run typecheck

      - name: Build
        if: steps.published.outputs.already != 'true'
        run: npm run build

      - name: Test
        if: steps.published.outputs.already != 'true'
        run: npx vitest run

      - name: Verify package
        if: steps.published.outputs.already != 'true'
        run: npm pack --dry-run

      - name: Publish to npm
        if: steps.published.outputs.already != 'true'
        run: npm publish --access public

      - name: Confirm published
        run: |
          VER="${{ steps.ver.outputs.pkg_version }}"
          npm view "@desurfofficial-ship-it/desurf@${VER}" version --registry https://registry.npmjs.org/
          echo "OK: @desurfofficial-ship-it/desurf@${VER} is on npm"
