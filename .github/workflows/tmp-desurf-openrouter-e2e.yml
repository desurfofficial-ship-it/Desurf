name: tmp-desurf-openrouter-e2e

on:
  workflow_dispatch:

jobs:
  e2e:
    name: Offline checks + one Desurf OpenRouter CLI call
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Offline fixture (deterministic)
        run: |
          set -euo pipefail
          node dist/cli.js test --suite fixtures/basic --case support-classifier-good --repeat 1
          echo "offline_exit=$?"

      - name: Failure path — missing API key (no secret used)
        run: |
          set +e
          unset OPENROUTER_API_KEY
          env -u OPENROUTER_API_KEY node dist/cli.js test \
            --suite fixtures/basic \
            --case support-classifier-good \
            --provider openrouter \
            --model openai/gpt-4o-mini \
            --repeat 1 > /tmp/missing_key.out 2>&1
          CODE=$?
          echo "missing_key_exit=${CODE}"
          # Show output; GitHub will mask secrets if any leaked (none expected)
          cat /tmp/missing_key.out
          if [ "$CODE" -eq 2 ]; then
            echo "missing_key_path=ok_exit_2"
          else
            echo "missing_key_path=unexpected_exit"
            exit 1
          fi
          if grep -qiE 'sk-[a-zA-Z0-9]{10,}|Bearer [A-Za-z0-9._-]{20,}' /tmp/missing_key.out; then
            echo "credential_leak_detected=true"
            exit 1
          fi
          echo "credential_leak_detected=false"

      - name: Failure path — invalid API key
        run: |
          set +e
          OPENROUTER_API_KEY="invalid-desurf-probe-key-not-real" node dist/cli.js test \
            --suite fixtures/basic \
            --case support-classifier-good \
            --provider openrouter \
            --model openai/gpt-4o-mini \
            --repeat 1 > /tmp/bad_key.out 2>&1
          CODE=$?
          echo "invalid_key_exit=${CODE}"
          cat /tmp/bad_key.out
          if [ "$CODE" -eq 2 ]; then
            echo "invalid_key_path=ok_exit_2"
          else
            echo "invalid_key_path=unexpected_exit"
            exit 1
          fi
          if grep -F "invalid-desurf-probe-key-not-real" /tmp/bad_key.out; then
            echo "invalid_key_leaked_in_output=true"
            exit 1
          fi
          echo "invalid_key_leaked_in_output=false"

      - name: Live Desurf CLI → OpenRouterAdapter (one request)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENROUTER_API_KEY//[[:space:]]/}" ]; then
            echo "secret_present=false"
            exit 1
          fi
          echo "secret_present=true"

          # Prove CLI path: desurf binary from this build, not raw curl.
          # Single known-good case, repeat 1 → at most one live model call
          # when provider is openrouter (SavedOutput is not used).
          set +e
          node dist/cli.js test \
            --suite fixtures/basic \
            --case support-classifier-good \
            --provider openrouter \
            --model openai/gpt-4o-mini \
            --repeat 1 > /tmp/live.out 2>&1
          CODE=$?
          set -e
          echo "live_desurf_exit=${CODE}"
          cat /tmp/live.out

          # Must not print the real secret
          # (GitHub masks secrets as ***; also check we did not echo env)
          if grep -qiE 'OPENROUTER_API_KEY=|Authorization: Bearer ' /tmp/live.out; then
            echo "secret_header_or_env_leaked=true"
            exit 1
          fi
          echo "secret_header_or_env_leaked=false"

          # Adapter path indicators: ERROR with OpenRouterAdapter prefix vs PASS/REGRESSION
          if grep -q "OpenRouterAdapter: missing API key" /tmp/live.out; then
            echo "live_path=missing_key_unexpected"
            exit 1
          fi

          if [ "$CODE" -eq 2 ]; then
            echo "live_result=provider_or_tool_error"
            # Still went through Desurf CLI; surface for report
            exit 1
          fi

          # Exit 0 = PASS (assertions held on live output)
          # Exit 1 = REGRESSION/FLAKY (live output did not meet contract — still proves adapter path)
          if [ "$CODE" -eq 0 ]; then
            echo "live_result=PASS"
          elif [ "$CODE" -eq 1 ]; then
            echo "live_result=QUALITY_GATE_FAIL_but_adapter_returned_output"
          else
            echo "live_result=unexpected_exit_${CODE}"
            exit 1
          fi

          if grep -qE 'PASS|REGRESSION|FLAKY' /tmp/live.out; then
            echo "desurf_reliability_line_present=true"
          else
            echo "desurf_reliability_line_present=false"
            exit 1
          fi
