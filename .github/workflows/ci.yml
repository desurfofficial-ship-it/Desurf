# Desurf — Regression Gate + packaging verification
# Offline-only. No API keys. No live model calls.
# Exit codes from the CLI are the quality gate:
#   0 = PASS
#   1 = FLAKY or REGRESSION
#   2 = ERROR / tool failure

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-gate:
    name: Offline regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # No package-lock.json in repo — do not set cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Offline regression gate
        # Runs the saved-output fixture from the repo. Failures exit 1 (quality) or 2 (error).
        run: npm run test:offline

      - name: Pack
        run: npm pack

      - name: Clean package install + CLI verification
        # Install the generated tarball into an empty directory and run the installed binary.
        # Fixture is provided by the caller (repo checkout), not shipped inside the package.
        run: |
          set -e
          mkdir -p /tmp/desurf-pack-test
          cd /tmp/desurf-pack-test
          npm install "$GITHUB_WORKSPACE"/desurf-0.1.0.tgz
          mkdir -p fixtures/basic/{inputs,outputs,prompts}
          cp -a "$GITHUB_WORKSPACE"/fixtures/basic/. fixtures/basic/
          ./node_modules/.bin/desurf test --suite fixtures/basic --repeat 3
