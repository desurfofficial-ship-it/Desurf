# Desurf — Regression Gate + packaging verification
# Offline-only. No API keys. No live model calls.
# Exit codes from the CLI are the quality gate:
#   0 = PASS
#   1 = FLAKY or REGRESSION
#   2 = ERROR / tool failure

name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

jobs:
  offline-gate:
    name: Offline regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # package-lock.json is committed; CI uses npm install (not npm ci)
          # so the lockfile must stay in sync with package.json — S4d-adjacent
          # release discipline, verified by the m4 release guards.

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Offline regression gate
        # Built CLI only. Offline provider (default). No API keys. No live models.
        # Exit 0 = pass; exit 1 = REGRESSION/FLAKY fails the job; exit 2 = ERROR fails the job.
        run: node dist/cli.js test --suite fixtures/basic

      - name: Pack
        run: npm pack

      - name: Clean package install + CLI verification
        # Install the generated tarball into an empty directory and run the installed binary.
        # Fixture is provided by the caller (repo checkout), not shipped inside the package.
        # Tarball name is resolved dynamically from package name + version (no hard-coded filename).
        run: |
          set -euo pipefail
          # Scoped package tarball: desurfofficial-ship-it-desurf-<version>.tgz
          TARBALL=$(ls -1 "$GITHUB_WORKSPACE"/desurfofficial-ship-it-desurf-*.tgz 2>/dev/null | head -n 1)
          if [ -z "$TARBALL" ] || [ ! -f "$TARBALL" ]; then
            echo "No desurfofficial-ship-it-desurf-*.tgz found after npm pack"
            exit 2
          fi
          echo "Using tarball: $TARBALL"
          mkdir -p /tmp/desurf-pack-test
          cd /tmp/desurf-pack-test
          npm install "$TARBALL"
          ./node_modules/.bin/desurf --version
          ./node_modules/.bin/desurf init ./from-pack
          ./node_modules/.bin/desurf test --suite ./from-pack
