# Desurf — reusable CI gate (composite Action)
# Default offline; optional live inputs for drift-watch.
name: Desurf Offline Gate
author: desurfofficial-ship-it
description: >
  Run Desurf regression tests (offline by default). Optional live provider
  inputs support scheduled drift-watch. Propagates exit codes 0/1/2.
branding:
  icon: check-circle
  color: green
inputs:
  suite:
    description: Path to Desurf suite directory (or suite.json)
    required: true
  version:
    description: npm package version (explicit semver; never latest)
    required: false
    default: "0.6.0"
  package-version:
    description: Deprecated alias for version
    required: false
    default: ""
  node-version:
    description: Node.js version (>=18)
    required: false
    default: "22"
  provider:
    description: Live provider (openrouter|openai|anthropic|gemini). Empty = offline.
    required: false
    default: ""
  model:
    description: Optional model id for live providers
    required: false
    default: ""
  repeat:
    description: --repeat for live runs (1-100)
    required: false
    default: "1"
  timeout-ms:
    description: Optional --timeout-ms for live providers
    required: false
    default: ""
  max-retries:
    description: Optional --max-retries for live providers
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Run Desurf gate
      shell: bash
      env:
        DESURF_SUITE: ${{ inputs.suite }}
        DESURF_VERSION: ${{ inputs.version }}
        DESURF_PACKAGE_VERSION: ${{ inputs.package-version }}
        DESURF_NODE_VERSION: ${{ inputs.node-version }}
        DESURF_PROVIDER: ${{ inputs.provider }}
        DESURF_MODEL: ${{ inputs.model }}
        DESURF_REPEAT: ${{ inputs.repeat }}
        DESURF_TIMEOUT_MS: ${{ inputs.timeout-ms }}
        DESURF_MAX_RETRIES: ${{ inputs.max-retries }}
      run: bash "${{ github.action_path }}/action/run-gate.sh"
